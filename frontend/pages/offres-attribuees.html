<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H-teach – Offres attribuées</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/offres-attribuees.js"></script>
  </head>
  <body>
    <header id="entete"></header>

    <main class="page">
      <p id="message-succes" class="message-succes" hidden></p>

      <h1>Offres attribuées</h1>

      <div class="carte conteneur-tableau">
        <table class="tableau">
          <thead>
            <tr>
              <th>Offre</th>
              <th>Parent</th>
              <th>Enseignant retenu</th>
              <th>Règle appliquée</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="corps-attributions"></tbody>
        </table>
      </div>

      <div id="vide-attributions" class="etat-vide" hidden>
        <div class="icone">∅</div>
        <h2>Aucune offre attribuée pour l'instant</h2>
      </div>
    </main>
  </body>
</html>
